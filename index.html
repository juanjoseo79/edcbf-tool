  "II": {

    "CLESA": "Departamento de Ahuachapán: Municipio de Ahuachapán, Metalío y Apancoyo.",

  },
  "III": {

    "CAESS": "Departamento de San Salvador: Barrio El Centro, Cima de San Bartolo Ilopango y Urb. Metrópolis.",
    "CLESA": "Departamento de Ahuachapán: Municipio de Atiquizaya.",
    "EEO": "Departamento de Morazán: Municipios de Jocoro, San Francisco Gotera, Jocoaitique.\nDepartamento de San Miguel: Municipio de San Miguel Centro, La Estancia, Chapeltique, Ciudad Barrios.",
  },
  "IV": {

    "CAESS": "Departamento de San Salvador: Colonia Maquilishuat, Av. Masferrer Norte, Alpes de la Escalón, Residencial Cumbres de Ambrogi, Escalón, Paseo General Escalón, Club Campestre, Plaza Salvador del Mundo, Condominio Miramonte, Colonia El Rosal, Colegio García Flamenco, Metrocentro, Mariona, Los Llanitos, Urbanización Alta Vista 1 y 2, Zona de Ilopango Apulo, Comunidad La Chacra, Comunidad Coro Nuevo San Salvador.",
    "CLESA": "Departamento de Santa Ana: Municipio de Santa Ana (Zona Urbana).",
    "EEO": "Departamento de San Vicente: Municipio de San Lorenzo.\nDepartamento de Usulután: Municipio de Usulután, Santa Anita, Ereguayquín.\nDepartamento de San Miguel: Chinameca, Moncagua y zona de Agua Zarca.",
  },
  "V": {
    "DELSUR": "Departamento de San Salvador: Sector de Los Planes de Renderos y Panchimalco.\nDepartamento de La Libertad: Sector de Santa Tecla en colonias Santa Mónica, Bosques de Santa Teresa, Jardines de Merliot, Jardines de La Sabana, Urbanizaciones Jardines del Volcán, Jardines de La Libertad, Jardines de Cuscatlán, Jardines de La Hacienda. Sector de El Trébol y Eco-parque El Espino, Sector sobre calle al Volcán, cantón Álvarez, cantón San Juan Los Planes, Ojo de Agua, Cantón El Progreso, Finca Cajamarca, Los Munguía, El Calvario, Las Granadillas.\nDepartamento de La Paz: Sector de Las Isletas, El Achotal, El Pimental, San José Luna y hacia playa San Marcelino, Sectores sobre calle de San Luis Talpa hacia La Zunganera. Playa Amatecampo y El Pimental.",
    "CAESS": "Departamento de Cabañas: Municipio de Ilobasco, San Isidro y Sensuntepeque.\nDepartamento de San Salvador: Cimas de San Bartolo, Cumbres de San Bartolo y Lotificación Los Planes, Colonia El Paraíso, Comunidad San Martín, Comunidad y Urbanización La Chacra parte del Barrio El Centro, Urbanización Cumbres de Miralvalle, Residencial Lomas de San Francisco, Comunidad Monseñor Romero, Colonia Escalón, Nejapa, Lotificación Joyas del Norte, Lotificación Santa Carlota 1 y 2, Caserío Hacienda Mapilapa.",
    "CLESA": "Departamento de Sonsonate: Municipio de Acajutla, Municipio Izalco (Zona Atecozol).",

  },
  "VI": {
    "DELSUR": "Departamento de La Libertad: sobre boulevard Orden de Malta y Luis Poma, sector de avenida del Bosque, Arcos de Santa Elena, Casa Linda, Santa Elena. Sobre carretera panamericana entre boulevard Orden de Malta y Monseñor Romero. Sectores de Santa Tecla colonia Utila, Residencial Primavera, El Carmen, Maya.",
    "CAESS": "Departamento de Cabañas: Sensuntepeque, Ilobasco y Jutiapa.\nDepartamento de Chalatenango: Chalatenango (Zona Sur).\nDepartamento de San Salvador: Cuscatancingo, Mejicanos, Cantón Guadalupe y Los Martínez, Urbanización San Mateo, Residencial Buenos Aires, parte del reparto El Rosal, Colonia 3 de Mayo y parte de colonia Cucumacayán.",
    "CLESA": "",
    "EEO": "Departamento de San Miguel: Municipio de San Miguel Centro y Oeste.",
  },
};

const ETAPA_HZ = { "I":"59.3 Hz","II":"59.1 Hz","III":"58.9 Hz","IV":"58.5 Hz","V":"58.2 Hz","VI":"57.9 Hz" };
const DISTRIBUIDORES = ["DELSUR","CAESS","CLESA","EEO"];
const NUMS_ROM = ["I","II","III","IV","V","VI"];

const T = {
  bg:"#0f1117", surface:"#1a1d27", surfaceAlt:"#21253a", card:"#1e2235", cardBorder:"#2d3250",
  accent:"#4f7cff", accentDim:"#2a3a7a", accentText:"#8aaeff",
  text:"#e8eaf6", textMuted:"#8b90b8", textDim:"#555a7a",
  success:"#2dd4a0", successBg:"#0d2e25", successBorder:"#1a5c45", danger:"#ff6b6b",
};

function wrapText(ctx, text, maxW) {
  const words = text.split(" "), lines = [];
  let cur = "";
  for (const w of words) {
    const test = cur ? cur + " " + w : w;
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

function buildImage(resultado, etapas, W) {
  const FS=12,LH=17,PAD=14,VPAD=9,HEADER_H=60,COL_H=28,FOOTER_H=28,DIST_W=100;
  const multi = etapas.length > 1;
  const ZONA_W = Math.floor((W - PAD*2 - DIST_W) / (multi ? etapas.length : 1));
  const c = document.createElement("canvas");
  c.width = W; c.height = 10;
  const g = c.getContext("2d");

  function zonasLines(zonas) {
    const lines = [];
    zonas.split("\n").forEach(l => {
      const [dep,...r] = l.split(":");
      const z = r.join(":").trim();
      g.font = `bold ${FS}px sans-serif`;
      lines.push({ text: dep.trim()+(z?":":""), bold:true });
      if (z) { g.font=`${FS}px sans-serif`; wrapText(g,z,ZONA_W-16).forEach(wl=>lines.push({text:"  "+wl,bold:false})); }
    });
    return lines;
  }

  const rows = resultado.map(({distribuidor,items})=>{
    let maxL=1;
    if (multi) { etapas.forEach(et=>{ const it=items.find(i=>i.etapa===et); if(it) maxL=Math.max(maxL,zonasLines(it.zonas).length); }); }
    else items.forEach(({zonas})=>maxL=Math.max(maxL,zonasLines(zonas).length));
    return {distribuidor,items,h:Math.max(maxL*LH+VPAD*2,38)};
  });

  const totalH = HEADER_H+COL_H+rows.reduce((s,r)=>s+r.h,0)+FOOTER_H;
  c.height = totalH;
  const ctx = c.getContext("2d");
  const lbl = etapas.length===1?`Etapa ${etapas[0]}`:`Etapas ${etapas.join(" y ")}`;

  ctx.fillStyle="#0f1117"; ctx.fillRect(0,0,W,totalH);
  ctx.fillStyle="#1e2235"; ctx.fillRect(0,0,W,HEADER_H);
  ctx.fillStyle="#4f7cff"; ctx.fillRect(0,0,4,HEADER_H);
  ctx.fillStyle="#e8eaf6"; ctx.font=`bold 15px sans-serif`; ctx.fillText("EDCBF — "+lbl,PAD+8,26);
  ctx.font=`11px sans-serif`; ctx.fillStyle="#8b90b8";
  ctx.fillText("Esquema de Desconexión de Carga por Baja Frecuencia · Unidad de Transacciones",PAD+8,44);

  let y=HEADER_H;
  ctx.fillStyle="#21253a"; ctx.fillRect(0,y,W,COL_H);
  ctx.fillStyle="#4f7cff"; ctx.font=`bold 9px sans-serif`;
  ctx.fillText("DISTRIBUIDOR",PAD+8,y+18);
  if (multi) etapas.forEach((et,i)=>ctx.fillText(`ETAPA ${et} (${ETAPA_HZ[et]})`,PAD+DIST_W+i*ZONA_W+6,y+18));
  else ctx.fillText(`ZONAS AFECTADAS — ETAPA ${etapas[0]} (${ETAPA_HZ[etapas[0]]})`,PAD+DIST_W+6,y+18);
  y+=COL_H;

  rows.forEach(({distribuidor,items,h},ri)=>{
    ctx.fillStyle=ri%2===0?"#1a1d27":"#1e2235"; ctx.fillRect(0,y,W,h);
    ctx.fillStyle="#8aaeff"; ctx.font=`bold ${FS}px sans-serif`;
    wrapText(ctx,distribuidor,DIST_W-PAD-4).forEach((l,li)=>ctx.fillText(l,PAD+8,y+VPAD+FS+li*LH));
    const drawZonas=(zonas,x)=>{ zonasLines(zonas).forEach((line,li)=>{ ctx.font=`${line.bold?"bold ":""}${FS}px sans-serif`; ctx.fillStyle=line.bold?"#c5caf0":"#8b90b8"; ctx.fillText(line.text,x+6,y+VPAD+FS+li*LH); }); };
    if (multi) etapas.forEach((et,i)=>{ const x=PAD+DIST_W+i*ZONA_W; const item=items.find(it=>it.etapa===et); if(item)drawZonas(item.zonas,x); else{ctx.fillStyle="#555a7a";ctx.font=`italic 11px sans-serif`;ctx.fillText("—",x+6,y+VPAD+FS);} });
    else items.forEach(({zonas})=>drawZonas(zonas,PAD+DIST_W));
    ctx.strokeStyle="#2d3250"; ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(0,y+h);ctx.lineTo(W,y+h);ctx.stroke();
    ctx.beginPath();ctx.moveTo(PAD+DIST_W,y);ctx.lineTo(PAD+DIST_W,y+h);ctx.stroke();
    if(multi)etapas.forEach((_,i)=>{if(!i)return;const x=PAD+DIST_W+i*ZONA_W;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+h);ctx.stroke();});
    y+=h;
  });

  ctx.fillStyle="#1a1d27"; ctx.fillRect(0,y,W,FOOTER_H);
  ctx.fillStyle="#555a7a"; ctx.font=`9px sans-serif`;
  ctx.fillText(new Date().toLocaleString("es-SV"),PAD+8,y+18);
  ctx.fillText("Unidad de Transacciones · GOE",W-220,y+18);
  return c.toDataURL("image/png");
}

function generarMensaje({saludo,horaIni,horaFin,etapas,mw,mexGua,nuevamente,tipo,origen,fuente,causa}) {
  if (!horaIni || etapas.length===0) return null;
  const sorted=[...etapas].sort((a,b)=>NUMS_ROM.indexOf(a)-NUMS_ROM.indexOf(b));
  const et=sorted.length===1?"etapa "+sorted[0]:"etapas "+sorted.slice(0,-1).join(", ")+" y "+sorted[sorted.length-1];
  const nv=nuevamente?"nuevamente ":"";
  const ESQUEMA="Esquema de Desconexión de Carga por Baja Frecuencia (EDCBF)";
  let msg=saludo;
  if(horaFin) msg+=`De las ${horaIni} a ${horaFin} horas, ${nv}operación de ${et} del ${ESQUEMA}`;
  else msg+=`A las ${horaIni} horas, ${nv}operación de ${et} del ${ESQUEMA}`;
  if(tipo==="regional"){
    if(mw) msg+=`, perdiéndose ${mw} MW de carga`;
    msg+=" por evento regional";
    if(mexGua) msg+=" y disparo de interconexión MEX-GUA";
    msg+=".";
    if(horaFin) msg+=" Carga totalmente recuperada.";
    else msg+=" Carga todavía fuera a este momento debido a que no se tienen condiciones para normalizarla.";
    if(origen){ msg+=` Origen en ${origen}`; if(fuente) msg+=` según informa ${fuente}`; msg+="."; }
  } else {
    if(mw) msg+=`, desconectándose ${mw} MW de demanda en El Salvador`;
    if(causa) msg+=`, por ${causa}`;
    if(mexGua) msg+=(causa||mw)?" y disparo de la interconexión MEX-GUA":", con disparo de la interconexión MEX-GUA";
    msg+=".";
    if(horaFin) msg+=` Carga normalizada a las ${horaFin} horas.`;
    else msg+=" Carga todavía fuera a este momento debido a que no se tienen condiciones para normalizarla.";
  }
  return msg;
}

function Switch({checked,onChange}) {
  return React.createElement("div",{
    onClick:()=>onChange(!checked),
    style:{width:36,height:20,borderRadius:20,background:checked?T.accent:T.cardBorder,cursor:"pointer",position:"relative",flexShrink:0,transition:"background .2s"}
  }, React.createElement("div",{style:{position:"absolute",width:14,height:14,background:"#fff",borderRadius:"50%",top:3,left:checked?19:3,transition:"left .2s"}}));
}

function TabZonas({etapasSeleccionadas,onEtapasChange}) {
  const [imgSrc,setImgSrc]=useState(null);
  const containerRef=useRef(null);

  const toggleEtapa=et=>{ onEtapasChange(prev=>prev.includes(et)?prev.filter(e=>e!==et):[...prev,et]); setImgSrc(null); };

  const resultado=etapasSeleccionadas.length>0
    ?DISTRIBUIDORES.map(dist=>({distribuidor:dist,items:etapasSeleccionadas.map(et=>({etapa:et,zonas:EDCBF_DATA[et][dist]||""})).filter(it=>it.zonas)})).filter(r=>r.items.length>0)
    :null;

  const generarImagen=()=>{ const W=containerRef.current?containerRef.current.offsetWidth:900; setImgSrc(buildImage(resultado,etapasSeleccionadas,Math.max(W,600))); };
  const descargarImagen=()=>{ if(!imgSrc)return; const a=document.createElement("a"); a.href=imgSrc; a.download=`EDCBF_Etapa${etapasSeleccionadas.join("-")}.png`; a.click(); };

  const renderZonas=zonas=>zonas.split("\n").map((l,j)=>{
    const [dep,...r]=l.split(":");
    const z=r.join(":").trim();
    return React.createElement("div",{key:j,style:{marginBottom:3}},
      React.createElement("span",{style:{fontWeight:700,color:T.accentText,fontSize:11}},dep.trim()+(z?":":"")),
      z&&React.createElement("span",{style:{color:T.textMuted,fontSize:11}}," "+z)
    );
  });

  const e=React.createElement;
  return e("div",{ref:containerRef},
    e("div",{style:{marginBottom:16}},
      e("div",{style:{fontSize:10,fontWeight:700,color:T.textDim,textTransform:"uppercase",letterSpacing:1,marginBottom:10}},"Seleccionar etapa(s)"),
      e("div",{style:{display:"flex",flexWrap:"wrap",gap:8}},
        NUMS_ROM.map(et=>{
          const activa=etapasSeleccionadas.includes(et);
          return e("button",{key:et,onClick:()=>toggleEtapa(et),style:{padding:"7px 0",width:72,borderRadius:8,border:activa?`1px solid ${T.accent}`:`1px solid ${T.cardBorder}`,cursor:"pointer",background:activa?T.accentDim:T.surface,color:activa?T.accentText:T.textMuted,fontSize:12,fontWeight:700,transition:"all .15s"}},
            e("div",{style:{fontSize:13}},"Etapa "+et),
            e("div",{style:{fontSize:9,opacity:0.7,fontWeight:400}},ETAPA_HZ[et])
          );
        })
      ),
      etapasSeleccionadas.length>0&&e("div",{style:{marginTop:8,fontSize:11,color:T.textDim,display:"flex",alignItems:"center",gap:12}},
        e("span",null,etapasSeleccionadas.length+" etapa"+(etapasSeleccionadas.length>1?"s":"")+" seleccionada"+(etapasSeleccionadas.length>1?"s":"")),
        e("span",{style:{cursor:"pointer",color:T.danger,textDecoration:"underline"},onClick:()=>{onEtapasChange(()=>[]);setImgSrc(null);}},"limpiar"),
        e("span",{style:{color:T.accentText}},'· se usarán en "Redactar mensaje"')
      )
    ),
    resultado&&e("div",null,
      e("div",{style:{borderRadius:10,overflow:"auto",border:`1px solid ${T.cardBorder}`,marginBottom:12}},
        e("div",{style:{background:T.accentDim,color:T.accentText,padding:"9px 14px",fontSize:12,fontWeight:700,borderBottom:`1px solid ${T.cardBorder}`}},
          "⚡ "+(etapasSeleccionadas.length===1?`Etapa ${etapasSeleccionadas[0]}`:`Etapas ${etapasSeleccionadas.join(" y ")}`)+" — Zonas afectadas"
        ),
        e("table",{style:{width:"100%",borderCollapse:"collapse",fontSize:11}},
          e("thead",null,e("tr",{style:{background:T.surfaceAlt}},
            e("th",{style:{padding:"7px 14px",textAlign:"left",fontWeight:700,fontSize:9,color:T.textDim,textTransform:"uppercase",letterSpacing:0.8,width:90,whiteSpace:"nowrap",borderRight:`1px solid ${T.cardBorder}`}},"Distribuidor"),
            etapasSeleccionadas.length>1
              ?etapasSeleccionadas.map(et=>e("th",{key:et,style:{padding:"7px 10px",textAlign:"left",fontWeight:700,fontSize:9,color:T.textDim,textTransform:"uppercase",letterSpacing:0.8,borderRight:`1px solid ${T.cardBorder}`}},`Etapa ${et} (${ETAPA_HZ[et]})`))
              :e("th",{style:{padding:"7px 10px",textAlign:"left",fontWeight:700,fontSize:9,color:T.textDim,textTransform:"uppercase",letterSpacing:0.8}},`Zonas afectadas — Etapa ${etapasSeleccionadas[0]} (${ETAPA_HZ[etapasSeleccionadas[0]]})`)
          )),
          e("tbody",null,resultado.map(({distribuidor,items},ri)=>
            e("tr",{key:ri,style:{background:ri%2===0?T.surface:T.card,verticalAlign:"top",borderBottom:`1px solid ${T.cardBorder}`}},
              e("td",{style:{padding:"10px 14px",fontWeight:700,color:T.accentText,fontSize:12,borderRight:`1px solid ${T.cardBorder}`,whiteSpace:"nowrap"}},distribuidor),
              etapasSeleccionadas.length>1
                ?etapasSeleccionadas.map((et,i)=>{ const item=items.find(it=>it.etapa===et); return e("td",{key:et,style:{padding:"10px 10px",borderRight:i<etapasSeleccionadas.length-1?`1px solid ${T.cardBorder}`:"none"}},item?renderZonas(item.zonas):e("span",{style:{color:T.textDim}},"—")); })
                :e("td",{style:{padding:"10px 10px"}},items.map(({zonas},k)=>e("div",{key:k},renderZonas(zonas))))
            )
          ))
        )
      ),
      e("div",{style:{display:"flex",gap:10}},
        e("button",{onClick:generarImagen,style:{flex:1,padding:"10px",borderRadius:8,border:`1px solid ${T.accent}`,background:T.accentDim,color:T.accentText,fontWeight:700,fontSize:12,cursor:"pointer"}},"Generar imagen PNG"),
        imgSrc&&e("button",{onClick:descargarImagen,style:{flex:1,padding:"10px",borderRadius:8,border:`1px solid ${T.successBorder}`,background:T.successBg,color:T.success,fontWeight:700,fontSize:12,cursor:"pointer"}},"Descargar PNG")
      ),
      imgSrc&&e("div",{style:{marginTop:12,borderRadius:10,overflow:"hidden",border:`1px solid ${T.cardBorder}`}},
        e("img",{src:imgSrc,alt:"EDCBF",style:{width:"100%",display:"block"}})
      )
    )
  );
}

function TabMensaje({etapasInyectadas}) {
  const SALUDOS=[{label:"Sin saludo",val:""},{label:"Buenos días",val:"Buenos días, "},{label:"Buenas tardes",val:"Buenas tardes, "},{label:"Buenas noches",val:"Buenas noches, "}];
  const [saludo,setSaludo]=useState("");
  const [horaIni,setHoraIni]=useState("");
  const [horaFin,setHoraFin]=useState("");
  const [etapas,setEtapas]=useState([]);
  const [mw,setMw]=useState("");
  const [mexGua,setMexGua]=useState(true);
  const [nuevamente,setNuevamente]=useState(false);
  const [tipo,setTipo]=useState("regional");
  const [origen,setOrigen]=useState("");
  const [fuente,setFuente]=useState("");
  const [causa,setCausa]=useState("");
  const [copied,setCopied]=useState(false);

  const etapasEfectivas=etapas.length>0?etapas:etapasInyectadas;
  const usandoInyectadas=etapas.length===0&&etapasInyectadas.length>0;
  const toggleEtapa=num=>setEtapas(prev=>prev.includes(num)?prev.filter(e=>e!==num):[...prev,num]);
  const fmtHora=val=>{ if(!val)return""; const[h,m]=val.split(":"); return`${h}:${m}`; };

  const mensaje=generarMensaje({saludo,horaIni:fmtHora(horaIni),horaFin:fmtHora(horaFin),etapas:etapasEfectivas,mw,mexGua,nuevamente,tipo,origen,fuente,causa});

  const copiar=()=>{ if(!mensaje)return; navigator.clipboard.writeText(mensaje).then(()=>{ setCopied(true); setTimeout(()=>setCopied(false),1800); }); };

  const inp={width:"100%",padding:"8px 10px",border:`1px solid ${T.cardBorder}`,borderRadius:8,fontSize:13,color:T.text,background:T.surface,outline:"none"};
  const card={background:T.card,borderRadius:10,padding:14,border:`1px solid ${T.cardBorder}`,marginBottom:0};
  const sLbl={fontSize:10,fontWeight:700,color:T.textDim,textTransform:"uppercase",letterSpacing:1,marginBottom:8,display:"block"};

  const e=React.createElement;
  return e("div",{style:{display:"flex",flexDirection:"column",gap:10}},

    e("div",{style:card},
      e("span",{style:sLbl},"Tipo de evento"),
      e("div",{style:{display:"flex",gap:8}},
        ["regional","nacional"].map(t=>e("button",{key:t,onClick:()=>setTipo(t),style:{flex:1,padding:"8px",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:600,border:tipo===t?`1px solid ${T.accent}`:`1px solid ${T.cardBorder}`,background:tipo===t?T.accentDim:T.surface,color:tipo===t?T.accentText:T.textMuted,transition:"all .15s"}},t.charAt(0).toUpperCase()+t.slice(1)))
      )
    ),

    e("div",{style:card},
      e("span",{style:sLbl},"Saludo inicial"),
      e("div",{style:{display:"flex",gap:6,flexWrap:"wrap"}},
        SALUDOS.map(({label,val})=>e("button",{key:label,onClick:()=>setSaludo(val),style:{padding:"6px 12px",borderRadius:8,cursor:"pointer",fontSize:12,border:saludo===val?`1px solid ${T.accent}`:`1px solid ${T.cardBorder}`,background:saludo===val?T.accentDim:T.surface,color:saludo===val?T.accentText:T.textMuted,fontWeight:saludo===val?700:400,transition:"all .15s"}},label))
      )
    ),

    e("div",{style:card},
      e("span",{style:sLbl},"Horario"),
      e("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}},
        e("div",null,e("label",{style:{...sLbl,marginBottom:4}},"Hora del evento"),e("input",{type:"time",value:horaIni,onChange:ev=>setHoraIni(ev.target.value)})),
        e("div",null,e("label",{style:{...sLbl,marginBottom:4}},"Normalización (opcional)"),e("input",{type:"time",value:horaFin,onChange:ev=>setHoraFin(ev.target.value)}))
      )
    ),

    e("div",{style:card},
      e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}},
        e("span",{style:{...sLbl,marginBottom:0}},"Etapas que operaron"),
        usandoInyectadas&&e("span",{style:{fontSize:10,color:T.accentText,fontWeight:600}},'Desde "Zonas afectadas"')
      ),
      e("div",{style:{display:"flex",gap:8,flexWrap:"wrap"}},
        NUMS_ROM.map(n=>{
          const activo=etapasEfectivas.includes(n);
          const inyectado=usandoInyectadas&&etapasInyectadas.includes(n);
          return e("button",{key:n,onClick:()=>toggleEtapa(n),style:{padding:"6px 14px",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700,border:activo?`1px solid ${inyectado?T.success:T.accent}`:`1px solid ${T.cardBorder}`,background:activo?(inyectado?T.successBg:T.accentDim):T.surface,color:activo?(inyectado?T.success:T.accentText):T.textMuted,transition:"all .15s"}},n);
        })
      ),
      usandoInyectadas&&e("div",{style:{marginTop:8,fontSize:10,color:T.textDim}},"Marcadas en verde vienen de la pestaña de zonas. Tocá cualquiera para editar manualmente.")
    ),

    e("div",{style:card},
      e("span",{style:sLbl},"Carga desconectada"),
      e("input",{type:"number",min:"0",placeholder:"MW desconectados (opcional)",value:mw,onChange:ev=>setMw(ev.target.value),style:{...inp,maxWidth:220,marginBottom:12}}),
      e("div",{style:{display:"flex",flexDirection:"column",gap:10}},
        [{label:"Disparo interconexión MEX-GUA",val:mexGua,set:setMexGua},{label:'Evento recurrente ("nuevamente")',val:nuevamente,set:setNuevamente}].map(({label,val,set})=>
          e("div",{key:label,style:{display:"flex",alignItems:"center",gap:10}},
            e(Switch,{checked:val,onChange:set}),
            e("span",{style:{fontSize:13,color:T.text}},label)
          )
        )
      )
    ),

    tipo==="regional"
      ?e("div",{style:card},
          e("span",{style:sLbl},"Origen del evento (opcional)"),
          e("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}},
            e("div",null,e("label",{style:{...sLbl,marginBottom:4}},"País / origen"),e("input",{type:"text",placeholder:"ej. Panamá, Guatemala…",value:origen,onChange:ev=>setOrigen(ev.target.value)})),
            e("div",null,e("label",{style:{...sLbl,marginBottom:4}},"Fuente del dato"),e("input",{type:"text",placeholder:"ej. EOR",value:fuente,onChange:ev=>setFuente(ev.target.value)}))
          )
        )
      :e("div",{style:card},
          e("span",{style:sLbl},"Causa del evento"),
          e("textarea",{rows:2,placeholder:"ej. falla en línea 115 kV Soyapango–Santa Ana…",value:causa,onChange:ev=>setCausa(ev.target.value)})
        ),

    e("div",{style:{...card,marginTop:0}},
      e("span",{style:sLbl},"Mensaje generado"),
      e("div",{style:{background:T.surface,borderRadius:8,padding:"12px 14px",fontSize:13,color:mensaje?T.text:T.textDim,lineHeight:1.7,minHeight:64,fontStyle:mensaje?"normal":"italic",userSelect:"all",whiteSpace:"pre-wrap",border:`1px solid ${T.cardBorder}`}},
        mensaje||"Complete hora del evento y al menos una etapa para generar el mensaje."
      ),
      e("button",{onClick:copiar,disabled:!mensaje,style:{width:"100%",marginTop:10,padding:"10px",borderRadius:8,border:copied?`1px solid ${T.success}`:`1px solid ${T.cardBorder}`,background:copied?T.successBg:T.surface,color:copied?T.success:T.textMuted,fontWeight:600,fontSize:13,cursor:mensaje?"pointer":"not-allowed",opacity:mensaje?1:0.4,transition:"all .2s"}},
        copied?"✓ Copiado":"Copiar mensaje"
      )
    )
  );
}

function App() {
  const [tab,setTab]=useState("mensaje");
  const [etapasShared,setEtapasShared]=useState([]);
  const e=React.createElement;

  return e("div",{style:{fontFamily:"system-ui,sans-serif",maxWidth:680,margin:"0 auto",background:T.bg,minHeight:"100vh",padding:"16px"}},
    e("div",{style:{marginBottom:16,paddingBottom:16,borderBottom:`1px solid ${T.cardBorder}`}},
      e("div",{style:{display:"flex",alignItems:"center",gap:10}},
        e("div",{style:{width:4,height:36,background:T.accent,borderRadius:4}}),
        e("div",null,
          e("div",{style:{fontSize:11,color:T.textDim,letterSpacing:1,textTransform:"uppercase",marginBottom:2}},"Sistema EDCBF · GOE"),
          e("div",{style:{fontSize:17,fontWeight:700,color:T.text,lineHeight:1.2}},"Esquema de Desconexión de Carga por Baja Frecuencia")
        )
      )
    ),
    e("div",{style:{display:"flex",gap:4,marginBottom:16,background:T.surface,borderRadius:10,padding:4,border:`1px solid ${T.cardBorder}`}},
      ["mensaje","zonas"].map(t=>e("button",{key:t,onClick:()=>setTab(t),style:{flex:1,padding:"8px 12px",borderRadius:8,border:"none",cursor:"pointer",background:tab===t?T.card:"transparent",color:tab===t?T.text:T.textMuted,fontWeight:tab===t?700:400,fontSize:13,transition:"all .15s",display:"flex",alignItems:"center",justifyContent:"center",gap:8}},
        t==="zonas"?"Zonas afectadas":"Redactar mensaje",
        t==="zonas"&&etapasShared.length>0&&e("span",{style:{background:T.accent,color:"#fff",fontSize:10,padding:"1px 7px",borderRadius:10,fontWeight:700}},etapasShared.length)
      ))
    ),
    tab==="zonas"
      ?e(TabZonas,{etapasSeleccionadas:etapasShared,onEtapasChange:setEtapasShared})
      :e(TabMensaje,{etapasInyectadas:etapasShared})
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
